name: Release

# Every push to main (i.e. every merged PR) ships a new minor release:
# v1 -> v1.1 -> v1.2 ... Pushes that only touch docs don't release.
#
# This runs on push rather than on pull_request: pull_request workflows from
# forks get a read-only token, so they couldn't publish a release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitleaks.toml"
      - ".github/workflows/gitleaks.yml"

permissions:
  contents: write

# never compute two version numbers at the same time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          if [[ -z "$latest" ]]; then
            next="v1"
          else
            major="${latest#v}"; major="${major%%.*}"
            minor="${latest#v$major}"; minor="${minor#.}"
            next="v$major.$(( ${minor:-0} + 1 ))"
          fi
          echo "Latest tag: ${latest:-none}, releasing $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Build the .deb
        env:
          CLISS_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          ./package.sh
          cp CLISS_PACKAGE.deb cliss.deb

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" cliss.deb \
            --target "$SHA" \
            --title "CLISS $TAG" \
            --generate-notes
